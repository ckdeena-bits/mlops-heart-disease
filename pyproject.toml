[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-heart-disease"
version = "0.1.0"
description = "End-to-End MLOps pipeline for Heart Disease Risk Prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Deenadayalan C K", email = "2025AE05402@wilp.bits-pilani.ac.in" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "prometheus-client>=0.17.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "pyyaml>=6.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "mlflow>=2.10.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
    "python-docx>=1.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --strict-markers"
